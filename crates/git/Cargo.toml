[package]
name = "git"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Pure-Rust git engine backend powering the desktop client"

[lib]
name = "git"
path = "src/lib.rs"

[dependencies]
ansi.workspace = true
chrono.workspace = true
forge-core.workspace = true
forge-github.workspace = true
fs-util.workspace = true
git2.workspace = true
gix.workspace = true
gix-status.workspace = true
highlight.workspace = true
icons.workspace = true
language.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
notify.workspace = true
keyring.workspace = true
log.workspace = true
rayon.workspace = true
trash.workspace = true
fuzzy-matcher.workspace = true

[dev-dependencies]
base64.workspace = true
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "status"
harness = false

[[bench]]
name = "diff"
harness = false

[[bench]]
name = "history"
harness = false

[[bench]]
name = "numstat"
harness = false

[[bench]]
name = "huge"
harness = false

[[bench]]
name = "diff_highlight"
harness = false

[[bench]]
name = "graph"
harness = false

[[bench]]
name = "refs"
harness = false

[[bench]]
name = "commit_detail"
harness = false

[[bench]]
name = "worktree_icon"
harness = false

[[bench]]
name = "diff_context"
harness = false
