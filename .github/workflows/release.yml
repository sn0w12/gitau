name: Build and Release

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    release-notes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            changelog: ${{ steps.generate_release_notes.outputs.changelog }}
        steps:
            - uses: actions/checkout@v7

            - name: Generate Release Notes
              id: generate_release_notes
              uses: mikepenz/release-changelog-builder-action@v5
              with:
                  configuration: .github/changelog-config.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-tauri:
        needs: release-notes
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "windows-latest"
                      args: "--bundles nsis"
                    - platform: "macos-latest"
                      args: "--target universal-apple-darwin --bundles dmg"
                      targets: "aarch64-apple-darwin,x86_64-apple-darwin"
                    - platform: "ubuntu-24.04"
                      args: "--bundles appimage"

        runs-on: ${{ matrix.platform }}
        env:
            TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "npm"

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.targets }}

            - name: Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

            - name: Install frontend dependencies
              run: npm ci

            - name: Build and publish
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: v__VERSION__
                  releaseName: "Release v__VERSION__"
                  releaseBody: ${{ needs.release-notes.outputs.changelog }}
                  releaseDraft: true
                  prerelease: false
                  uploadUpdaterJson: true
                  args: ${{ matrix.args }}
