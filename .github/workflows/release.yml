name: Build and Release

on:
    push:
        tags:
            - "v*.*.*"
            - "!v*.*.*-*"

jobs:
    release-notes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            changelog: ${{ steps.generate_release_notes.outputs.changelog }}
        steps:
            - uses: actions/checkout@v7

            - name: Generate Release Notes
              id: generate_release_notes
              uses: mikepenz/release-changelog-builder-action@v5
              with:
                  configuration: .github/changelog-config.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-tauri:
        needs: release-notes
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "windows-latest"
                      args: "--bundles nsis"
                    - platform: "macos-latest"
                      args: "--target universal-apple-darwin --bundles dmg"
                      targets: "aarch64-apple-darwin,x86_64-apple-darwin"
                    # 26.04 bundles glibc 2.43, which can load current host
                    # graphics drivers. 24.04's 2.39 cannot, so Chromium falls
                    # back to software rendering on newer distros.
                    - platform: "ubuntu-26.04"
                      args: "--bundles appimage --config .appimage/tauri.appimage.conf.json"
                    - platform: "ubuntu-26.04-arm"
                      args: "--bundles appimage --config .appimage/tauri.appimage.conf.json"

        runs-on: ${{ matrix.platform }}
        env:
            TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "npm"

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.targets }}

            - name: Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgtk-4-dev libgtk-3-dev librsvg2-dev xdg-utils patchelf \
                    libnss3 libgbm1 libasound2t64 libudev1 libxkbcommon-x11-0

            - name: Resolve CEF version
              if: runner.os == 'Linux'
              id: cef
              run: |
                  version=$(grep -A1 '^name = "cef"$' Cargo.lock | grep -m1 version | cut -d'"' -f2)
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Cache CEF
              if: runner.os == 'Linux'
              uses: actions/cache@v5.0.3
              with:
                  path: ~/.cache/tauri-cef
                  key: cef-${{ matrix.platform }}-${{ steps.cef.outputs.version }}

            - name: Install frontend dependencies
              run: npm ci

            - name: Configure AppImage NSS libraries
              if: runner.os == 'Linux'
              run: node scripts/appimage-nss.mjs

            - name: Build and publish
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # sharun_cef.rs downloads quick-sharun.sh from a fork that still
                  # points anylinux.c and gtk-class-fix.c at upstream main, which 404s
                  # (tauri-apps/tauri#16204). Pin both to the last commit the fork merged.
                  ANYLINUX_LIB_SOURCE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/d1bb26882eded9576bb0760aeb848179bbf64e9b/useful-tools/lib/anylinux.c
                  GTK_CLASS_FIX_SOURCE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/d1bb26882eded9576bb0760aeb848179bbf64e9b/useful-tools/lib/gtk-class-fix.c
              with:
                  tagName: v__VERSION__
                  releaseName: "Release v__VERSION__"
                  releaseBody: ${{ needs.release-notes.outputs.changelog }}
                  releaseDraft: true
                  prerelease: false
                  uploadUpdaterJson: true
                  args: ${{ matrix.args }}

            - name: Verify AppImage NSS modules
              if: runner.os == 'Linux'
              run: |
                  appimage="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)"
                  workdir="$(mktemp -d)"
                  (cd "$workdir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract 'lib/libsoftokn3.so' >/dev/null)
                  found="$(find "$workdir" -name libsoftokn3.so -print -quit)"
                  test -n "$found" || {
                      echo "libsoftokn3.so is missing from $appimage"
                      exit 1
                  }

            - name: Verify AppImage glibc
              if: runner.os == 'Linux'
              run: |
                  appimage="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)"
                  workdir="$(mktemp -d)"
                  (cd "$workdir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract 'lib/libc.so.6' >/dev/null)
                  libc="$(find "$workdir" -name libc.so.6 -print -quit)"
                  test -n "$libc" || {
                      echo "libc.so.6 is missing from $appimage"
                      exit 1
                  }
                  readelf -V "$libc" | grep -q 'GLIBC_2.43' || {
                      echo "$appimage does not bundle glibc 2.43"
                      exit 1
                  }
