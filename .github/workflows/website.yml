name: Rebuild website

on:
    release:
        types: [published]

jobs:
    rebuild:
        runs-on: ubuntu-latest
        steps:
            - run: sleep 60
            - run: curl -fsS -X POST "$SITE_DEPLOY_HOOK"
              env:
                  SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
